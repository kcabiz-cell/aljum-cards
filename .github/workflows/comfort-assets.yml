name: comfort-assets

on:
  schedule:
    - cron: "0 11 * * 2"   # 매주 화요일 20:00 KST (Claude 주간 예약 작업 21:07 KST 전에 생성)
  workflow_dispatch:
    inputs:
      start:
        description: "시작 날짜 YYYY-MM-DD (비우면 내일부터)"
        required: false
      days:
        description: "만들 일수"
        required: false
        default: "7"
      bonus:
        description: "보너스 릴스 날짜들 (쉼표 구분, 예: 2026-10-25,2026-10-28). 입력하면 이 날짜만 생성"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
          pip install pillow numpy requests
      - name: Generate assets
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY || vars.PIXABAY_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.bonus }}" ]; then
            python3 tools/comfort_assets.py --bonus "${{ github.event.inputs.bonus }}"
            exit 0
          fi
          ARGS=""
          if [ -n "${{ github.event.inputs.start }}" ]; then ARGS="$ARGS --start ${{ github.event.inputs.start }}"; fi
          ARGS="$ARGS --days ${{ github.event.inputs.days || '7' }}"
          python3 tools/comfort_assets.py $ARGS
      - name: Commit
        run: |
          git config user.name "aljum-bot"
          git config user.email "aljum-bot@users.noreply.github.com"
          git add comfort
          git diff --cached --quiet || (git commit -m "Add comfort assets" && git push)
